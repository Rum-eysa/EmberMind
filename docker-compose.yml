# Shared application environment for the api / celery / celery-beat services.
# Every value uses the ${VAR:-default} form so the container honours .env while
# still booting cleanly when a variable is unset. Defaults mirror
# src/config/settings.py exactly; note that passing an EMPTY value would override
# a non-empty code default (and crash int/bool parsing), so a default is given
# for every non-string setting here.
x-app-environment: &app-environment
  - APP_ENV=${APP_ENV:-production}
  - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set}
  - REDIS_URL=redis://redis:6379/0
  - FIRMS_API_KEY=${FIRMS_API_KEY:-}
  - FIRMS_SOURCES=${FIRMS_SOURCES:-VIIRS_SNPP_NRT,VIIRS_NOAA20_NRT,MODIS_Terra_CorrectedAnomalies,MODIS_Aqua_CorrectedAnomalies}
  - FIRMS_SOURCE=${FIRMS_SOURCE:-VIIRS_SNPP_NRT}
  - FIRMS_BBOX=${FIRMS_BBOX:-25,35,45,43}
  - FIRMS_SYNC_INTERVAL_MINUTES=${FIRMS_SYNC_INTERVAL_MINUTES:-10}
  - SATELLITE_DEDUP_TIME_WINDOW_MINUTES=${SATELLITE_DEDUP_TIME_WINDOW_MINUTES:-180}
  - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-}
  - WEATHER_SYNC_INTERVAL_MINUTES=${WEATHER_SYNC_INTERVAL_MINUTES:-10}
  - TOPOGRAPHY_SYNC_INTERVAL_MINUTES=${TOPOGRAPHY_SYNC_INTERVAL_MINUTES:-10}
  - LAND_COVER_SYNC_INTERVAL_MINUTES=${LAND_COVER_SYNC_INTERVAL_MINUTES:-10}
  - PIPELINE_MAX_RETRIES=${PIPELINE_MAX_RETRIES:-3}
  - PIPELINE_BACKOFF_FACTOR=${PIPELINE_BACKOFF_FACTOR:-2.0}
  - ROAD_NETWORK_SYNC_INTERVAL_MINUTES=${ROAD_NETWORK_SYNC_INTERVAL_MINUTES:-720}
  - EFFIS_HISTORICAL_YEARS=${EFFIS_HISTORICAL_YEARS:-2007,2008,2012,2017,2021}
  - EFFIS_HISTORICAL_SYNC_INTERVAL_MINUTES=${EFFIS_HISTORICAL_SYNC_INTERVAL_MINUTES:-10080}
  - FWI_ZONE_SIZE_DEG=${FWI_ZONE_SIZE_DEG:-0.5}
  - FWI_SYNC_INTERVAL_MINUTES=${FWI_SYNC_INTERVAL_MINUTES:-1440}
  - DATA_QUALITY_STALE_MULTIPLIER=${DATA_QUALITY_STALE_MULTIPLIER:-2}
  - DATA_QUALITY_FAILURE_WARNING_THRESHOLD=${DATA_QUALITY_FAILURE_WARNING_THRESHOLD:-3}
  - SPREAD_HORIZON_MINUTES=${SPREAD_HORIZON_MINUTES:-30,60,120}
  - SPREAD_POLYGON_VERTICES=${SPREAD_POLYGON_VERTICES:-36}
  - SPREAD_MODEL_NAME=${SPREAD_MODEL_NAME:-rothermel_v1}
  - FUEL_TRANSITION_ENABLED=${FUEL_TRANSITION_ENABLED:-true}
  - SPREAD_AUTO_TRIGGER_ENABLED=${SPREAD_AUTO_TRIGGER_ENABLED:-true}
  - SPREAD_TRIGGER_INTERVAL_MINUTES=${SPREAD_TRIGGER_INTERVAL_MINUTES:-10}
  - SPREAD_TRIGGER_DEBOUNCE_MINUTES=${SPREAD_TRIGGER_DEBOUNCE_MINUTES:-15}
  - SPREAD_TRIGGER_WIND_SPEED_KMH_THRESHOLD=${SPREAD_TRIGGER_WIND_SPEED_KMH_THRESHOLD:-10.0}
  - SPREAD_TRIGGER_WIND_DIR_DEG_THRESHOLD=${SPREAD_TRIGGER_WIND_DIR_DEG_THRESHOLD:-30.0}
  - SPREAD_TRIGGER_HUMIDITY_PCT_THRESHOLD=${SPREAD_TRIGGER_HUMIDITY_PCT_THRESHOLD:-10.0}
  - SPREAD_TRIGGER_TEMP_C_THRESHOLD=${SPREAD_TRIGGER_TEMP_C_THRESHOLD:-5.0}
  - FUEL_MOISTURE_MODEL_ENABLED=${FUEL_MOISTURE_MODEL_ENABLED:-true}
  - FUEL_MOISTURE_DIURNAL_TEMP_AMPLITUDE_C=${FUEL_MOISTURE_DIURNAL_TEMP_AMPLITUDE_C:-8.0}
  - FUEL_MOISTURE_DIURNAL_RH_AMPLITUDE_PCT=${FUEL_MOISTURE_DIURNAL_RH_AMPLITUDE_PCT:-25.0}
  - FUEL_MOISTURE_CONDITIONING_HOURS=${FUEL_MOISTURE_CONDITIONING_HOURS:-48}
  - SPREAD_UNCERTAINTY_WIND_DIR_DELTA_DEG=${SPREAD_UNCERTAINTY_WIND_DIR_DELTA_DEG:-10.0}
  - SPREAD_UNCERTAINTY_WIND_SPEED_FRACTION=${SPREAD_UNCERTAINTY_WIND_SPEED_FRACTION:-0.15}
  - SPREAD_BARRIERS_ENABLED=${SPREAD_BARRIERS_ENABLED:-true}
  - SPREAD_PERF_ENABLED=${SPREAD_PERF_ENABLED:-true}
  - SPREAD_PERF_CACHE_TTL_SECONDS=${SPREAD_PERF_CACHE_TTL_SECONDS:-120}
  - SPREAD_PERF_CACHE_GRID_DEG=${SPREAD_PERF_CACHE_GRID_DEG:-0.001}
  - SPREAD_RECOMPUTE_TARGET_SECONDS=${SPREAD_RECOMPUTE_TARGET_SECONDS:-10.0}
  - RISK_PANEL_THRESHOLD=${RISK_PANEL_THRESHOLD:-30.0}

services:
  db:
    image: postgres:15-alpine
    container_name: wildfire_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Use the container's runtime POSTGRES_USER/POSTGRES_DB (escaped with $$ so
      # Compose does not interpolate them at parse time); hardcoding a user here
      # would keep the db unhealthy whenever POSTGRES_USER is changed.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wildfire_network

  redis:
    image: redis:7-alpine
    container_name: wildfire_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wildfire_network

  app:
    build: .
    container_name: wildfire_api
    command: uvicorn src.fastapi_app:app --host 0.0.0.0 --port 8000
    environment: *app-environment
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wildfire_network

  celery:
    build: .
    container_name: wildfire_celery
    command: celery -A src.tasks:celery_app worker --loglevel=info
    healthcheck:
      disable: true
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wildfire_network

  celery-beat:
    build: .
    container_name: wildfire_celery_beat
    command: celery -A src.tasks:celery_app beat --loglevel=info
    healthcheck:
      disable: true
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wildfire_network

volumes:
  postgres_data:
  redis_data:

networks:
  wildfire_network:
    driver: bridge
