services:
  db:
    image: postgres:15-alpine
    container_name: wildfire_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wildfire_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wildfire_network

  redis:
    image: redis:7-alpine
    container_name: wildfire_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wildfire_network

  app:
    build: .
    container_name: wildfire_api
    command: uvicorn src.fastapi_app:app --host 0.0.0.0 --port 8000
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set}
      - REDIS_URL=redis://redis:6379/0
      - FIRMS_API_KEY=${FIRMS_API_KEY}
      - FIRMS_SOURCES=${FIRMS_SOURCES:-VIIRS_SNPP_NRT,VIIRS_NOAA20_NRT,MODIS_Terra_CorrectedAnomalies,MODIS_Aqua_CorrectedAnomalies}
      - FIRMS_SOURCE=${FIRMS_SOURCE:-VIIRS_SNPP_NRT}
      - SATELLITE_DEDUP_TIME_WINDOW_MINUTES=${SATELLITE_DEDUP_TIME_WINDOW_MINUTES:-180}
      - FWI_ZONE_SIZE_DEG=${FWI_ZONE_SIZE_DEG:-0.5}
      - FWI_SYNC_INTERVAL_MINUTES=${FWI_SYNC_INTERVAL_MINUTES:-1440}
      - FIRMS_BBOX=${FIRMS_BBOX:-25,35,45,43}
      - FIRMS_SYNC_INTERVAL_MINUTES=${FIRMS_SYNC_INTERVAL_MINUTES:-10}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wildfire_network

  celery:
    build: .
    container_name: wildfire_celery
    command: celery -A src.tasks:celery_app worker --loglevel=info
    healthcheck:
      disable: true
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set}
      - REDIS_URL=redis://redis:6379/0
      - FIRMS_API_KEY=${FIRMS_API_KEY}
      - FIRMS_SOURCES=${FIRMS_SOURCES:-VIIRS_SNPP_NRT,VIIRS_NOAA20_NRT,MODIS_Terra_CorrectedAnomalies,MODIS_Aqua_CorrectedAnomalies}
      - FIRMS_SOURCE=${FIRMS_SOURCE:-VIIRS_SNPP_NRT}
      - SATELLITE_DEDUP_TIME_WINDOW_MINUTES=${SATELLITE_DEDUP_TIME_WINDOW_MINUTES:-180}
      - FWI_ZONE_SIZE_DEG=${FWI_ZONE_SIZE_DEG:-0.5}
      - FWI_SYNC_INTERVAL_MINUTES=${FWI_SYNC_INTERVAL_MINUTES:-1440}
      - FIRMS_BBOX=${FIRMS_BBOX:-25,35,45,43}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wildfire_network

  celery-beat:
    build: .
    container_name: wildfire_celery_beat
    command: celery -A src.tasks:celery_app beat --loglevel=info
    healthcheck:
      disable: true
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set}
      - REDIS_URL=redis://redis:6379/0
      - FIRMS_API_KEY=${FIRMS_API_KEY}
      - FIRMS_SOURCES=${FIRMS_SOURCES:-VIIRS_SNPP_NRT,VIIRS_NOAA20_NRT,MODIS_Terra_CorrectedAnomalies,MODIS_Aqua_CorrectedAnomalies}
      - FIRMS_SOURCE=${FIRMS_SOURCE:-VIIRS_SNPP_NRT}
      - SATELLITE_DEDUP_TIME_WINDOW_MINUTES=${SATELLITE_DEDUP_TIME_WINDOW_MINUTES:-180}
      - FWI_ZONE_SIZE_DEG=${FWI_ZONE_SIZE_DEG:-0.5}
      - FWI_SYNC_INTERVAL_MINUTES=${FWI_SYNC_INTERVAL_MINUTES:-1440}
      - FIRMS_BBOX=${FIRMS_BBOX:-25,35,45,43}
      - FIRMS_SYNC_INTERVAL_MINUTES=${FIRMS_SYNC_INTERVAL_MINUTES:-10}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wildfire_network

volumes:
  postgres_data:
  redis_data:

networks:
  wildfire_network:
    driver: bridge
