# EM-109: Demo ortamına otomatik dağıtım (CD)
# main branch'ine her push'ta demo sunucusuna deploy eder.
name: Deploy Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-demo
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: demo
      url: https://demo.embermind.local

    steps:
      - uses: actions/checkout@v4

      - name: Build demo image
        run: docker build -t wildfire-demo:${{ github.sha }} .

      - name: Validate compose (demo profile)
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          DATABASE_URL: sqlite:///instance/wildfire-demo.db
          FIRMS_API_KEY: ""
        run: |
          docker compose -f docker-compose.yml -f docker-compose.demo.yml config --quiet

      # Gerçek deploy adımı — self-hosted runner veya cloud provider'a göre özelleştirilir
      - name: Deploy to demo server
        if: vars.DEMO_DEPLOY_ENABLED == 'true'
        run: |
          echo "Deploying wildfire-demo:${{ github.sha }} to demo environment..."
          # Example: ssh deploy@demo-server "docker pull && docker compose up -d"
          # Real implementation depends on infrastructure (AWS ECS, GCP Cloud Run, etc.)

      - name: Smoke test
        if: vars.DEMO_DEPLOY_ENABLED == 'true'
        run: |
          sleep 10
          curl -sf https://demo.embermind.local/health || exit 1

      - name: Comment on commit
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: ' Demo deploy pipeline completed for `${{ github.sha }}`'
            });
